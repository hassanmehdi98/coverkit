services:
  postgres:
    image: postgres:16
    container_name: coverkit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: coverkit
      POSTGRES_PASSWORD: coverkit
      POSTGRES_DB: coverkit
    ports:
      # Host 5433 avoids clashing with other local Postgres instances on 5432
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coverkit -d coverkit"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: coverkit-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: coverkit-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        echo "Waiting for MinIO..."
        until mc alias set local http://minio:9000 minioadmin minioadmin; do
          sleep 1
        done
        mc mb --ignore-existing local/coverkit-uploads
        mc anonymous set download local/coverkit-uploads
        echo "Bucket coverkit-uploads ready."

volumes:
  postgres_data:
  minio_data:
