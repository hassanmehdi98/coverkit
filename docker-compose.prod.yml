# Production stack: Next.js app + Caddy (HTTPS) + Postgres.
# Usage on the EC2 host:
#   cp .env.production.example .env.production && chmod 600 .env.production
#   # edit .env.production
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    # No host ports — Caddy is the only public entrypoint

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - internal

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coverkit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-coverkit}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coverkit -d coverkit"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    # Intentionally NOT published to the host

networks:
  internal:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
