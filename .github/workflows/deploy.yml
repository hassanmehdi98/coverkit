# Optional: deploy over SSH on push to main.
# GitHub Actions secrets:
#   DEPLOY_HOST    — IP or hostname only (e.g. 203.0.113.10)
#   DEPLOY_USER    — e.g. ubuntu
#   DEPLOY_SSH_KEY — private key for the instance
#   DEPLOY_APP_DIR — optional, default /opt/coverkit

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.DEPLOY_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then APP_DIR=/opt/coverkit; fi
            cd "$APP_DIR"
            git fetch --all --tags
            git checkout main
            git pull --ff-only origin main
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
            docker compose -f docker-compose.prod.yml --env-file .env.production ps
